services:
  - type: web
    name: thermosafe-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: APP_NAME
        value: THERMOSAFE AI
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: SATELLITE_DATA_MODE
        value: live
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://thermosafe-ai-2.onrender.com", "https://thermosafe-ai.onrender.com", "http://localhost:8000", "http://localhost:5173"]'
      - key: FIRMS_MAP_KEY
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./sih26162.db"
