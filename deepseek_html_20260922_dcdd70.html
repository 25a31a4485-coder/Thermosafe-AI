<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>THERMOSAFE AI — Industrial Thermal Intelligence</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Formal serif font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Blue + White professional palette */
    --bg-page: #FFFFFF;
    --bg-section: #F5F8FC;
    --bg-card: #FFFFFF;
    --bg-card-alt: #F0F6FC;
    --border: #D6E2EF;
    --border-strong: #B8CCE0;

    --navy: #0B2545;          /* headings / nav */
    --navy-2: #13315C;
    --blue: #1E5AA8;          /* primary buttons */
    --blue-hover: #174B8E;
    --blue-light: #E8F1FB;
    --cyan: #0891B2;
    --cyan-light: #E0F7FA;

    --text-primary: #0B2545;
    --text-secondary: #4A5568;
    --text-muted: #7A8699;

    /* Event colors (consistent everywhere) */
    --c-critical: #DC2626;    /* Red — Critical Industrial Fire */
    --c-high: #EA580C;        /* Orange — High-Risk Thermal */
    --c-gas: #CA8A04;         /* Yellow — Gas Flare */
    --c-persistent: #7C3AED;  /* Purple — Persistent Thermal */
    --c-facility: #2563EB;    /* Blue — Industrial Facility */
    --c-low: #16A34A;         /* Green — Low Risk / Normal */

    --shadow-sm: 0 1px 2px rgba(11,37,69,0.06);
    --shadow-md: 0 2px 8px rgba(11,37,69,0.08);
    --shadow-lg: 0 8px 24px rgba(11,37,69,0.12);
  }

  html, body {
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    background: var(--bg-page);
    color: var(--text-primary);
    height: 100%;
    overflow: hidden;
    max-width: 100%;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button { cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; }

  /* ============ LAYOUT ============ */
  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* Top bar */
  .topbar {
    height: 60px;
    background: var(--navy);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 14px;
    flex-shrink: 0;
    z-index: 100;
    border-bottom: 3px solid var(--blue);
    box-shadow: var(--shadow-md);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: 0.3px; white-space: nowrap; }
  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--c-critical), var(--c-high));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .logo-text { color: #FFFFFF; }
  .logo-text span { color: #7DD3FC; }

  .topbar-search { flex: 1; max-width: 420px; position: relative; }
  .topbar-search input {
    width: 100%; height: 38px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 0 12px 0 38px;
    color: #FFFFFF;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .topbar-search input::placeholder { color: rgba(255,255,255,0.5); }
  .topbar-search input:focus { border-color: #7DD3FC; background: rgba(255,255,255,0.15); }
  .topbar-search svg {
    position: absolute; left: 12px; top: 11px;
    width: 16px; height: 16px; color: rgba(255,255,255,0.6);
  }

  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .icon-btn {
    width: 38px; height: 38px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF;
    position: relative;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.2); }
  .badge-count {
    position: absolute; top: -4px; right: -4px;
    background: var(--c-critical);
    color: white;
    font-size: 10px;
    font-weight: 700;
    min-width: 18px; height: 18px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
    border: 2px solid var(--navy);
    font-family: 'Source Serif 4', serif;
  }

  .demo-pill {
    background: rgba(202,138,4,0.25);
    color: #FDE68A;
    border: 1px solid rgba(202,138,4,0.5);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  /* Main area */
  .main-area { flex: 1; display: flex; overflow: hidden; position: relative; }

  /* Sidebar */
  .sidebar {
    width: 230px;
    background: var(--bg-section);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    display: flex; flex-direction: column; gap: 2px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    border-radius: 6px;
    color: var(--navy-2);
    font-size: 14px;
    font-weight: 600;
    background: none; border: none;
    width: 100%; text-align: left;
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--blue-light); color: var(--navy); }
  .nav-item.active {
    background: var(--blue-light);
    color: var(--blue);
    border-left: 3px solid var(--blue);
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }

  .nav-section-label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text-muted);
    padding: 14px 12px 6px;
  }

  /* Content */
  .content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 18px; position: relative;
    background: var(--bg-page);
  }

  /* KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 18px;
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    position: relative; overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .kpi-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
  }
  .kpi-card.critical::before { background: var(--c-critical); }
  .kpi-card.high::before { background: var(--c-high); }
  .kpi-card.medium::before { background: var(--c-gas); }
  .kpi-card.low::before { background: var(--c-low); }
  .kpi-card.info::before { background: var(--c-facility); }
  .kpi-card.persistent::before { background: var(--c-persistent); }

  .kpi-label {
    font-size: 11px; color: var(--text-secondary);
    font-weight: 600; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .kpi-value {
    font-size: 28px; font-weight: 800;
    color: var(--navy); line-height: 1;
  }
  .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

  /* Grid layouts */
  .dashboard-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }

  .map-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    min-height: 400px; height: 100%;
    box-shadow: var(--shadow-sm);
  }
  #map { width: 100%; height: 100%; min-height: 400px; background: #F8FAFC; }

  .right-panel { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }
  .card-title {
    font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--navy);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .card-title svg { width: 15px; height: 15px; color: var(--blue); }

  /* Risk badges */
  .risk-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 4px;
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.6px; text-transform: uppercase;
  }
  .risk-critical { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
  .risk-high { background: #FFEDD5; color: #9A3412; border: 1px solid #FDBA74; }
  .risk-gas { background: #FEF3C7; color: #854D0E; border: 1px solid #FDE047; }
  .risk-persistent { background: #EDE9FE; color: #5B21B6; border: 1px solid #C4B5FD; }
  .risk-facility { background: #DBEAFE; color: #1E40AF; border: 1px solid #93C5FD; }
  .risk-low { background: #DCFCE7; color: #166534; border: 1px solid #86EFAC; }

  /* Progress bar */
  .progress-track {
    height: 8px; background: var(--bg-section);
    border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden; margin: 6px 0;
  }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

  /* Detail rows */
  .detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--text-secondary); font-weight: 500; }
  .detail-value { color: var(--navy); font-weight: 700; text-align: right; }

  /* Buttons */
  .btn {
    padding: 9px 16px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
    border: 1px solid transparent;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
    justify-content: center; min-height: 38px;
    font-family: inherit;
  }
  .btn-primary { background: var(--blue); color: #FFFFFF; }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-outline { background: #FFFFFF; color: var(--blue); border-color: var(--border-strong); }
  .btn-outline:hover { border-color: var(--blue); background: var(--blue-light); }
  .btn-danger { background: var(--c-critical); color: #FFFFFF; }
  .btn-danger:hover { background: #B91C1C; }
  .btn-warning { background: var(--c-high); color: #FFFFFF; }
  .btn-warning:hover { background: #C2410C; }
  .btn-success { background: var(--c-low); color: #FFFFFF; }
  .btn-success:hover { background: #15803D; }
  .btn-purple { background: var(--c-persistent); color: #FFFFFF; }
  .btn-purple:hover { background: #6D28D9; }
  .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 32px; }
  .btn-block { width: 100%; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* Live feed */
  .feed-item {
    display: flex; gap: 10px; padding: 8px 0;
    font-size: 12px; border-bottom: 1px solid var(--border);
  }
  .feed-time { color: var(--text-muted); font-family: 'Courier New', monospace; flex-shrink: 0; font-size: 11px; padding-top: 1px; font-weight: 600; }
  .feed-text { color: var(--text-secondary); }

  /* Bottom sheet (mobile) */
  .bottom-sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 32px rgba(11,37,69,0.2);
    z-index: 1000; max-height: 75vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    border-top: 3px solid var(--blue);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 10px auto; }
  .sheet-content { padding: 0 18px 18px; }

  /* Mobile nav */
  .mobile-nav {
    display: none; background: #FFFFFF;
    border-top: 1px solid var(--border);
    height: 60px; flex-shrink: 0;
    box-shadow: 0 -2px 8px rgba(11,37,69,0.06);
  }
  .mobile-nav-inner { display: flex; height: 100%; }
  .mobile-nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    background: none; border: none;
    color: var(--text-muted); font-size: 10px; font-weight: 700;
  }
  .mobile-nav-item.active { color: var(--blue); }
  .mobile-nav-item svg { width: 20px; height: 20px; }

  /* Notification Drawer */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(11,37,69,0.35);
    z-index: 1500; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

  .notification-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 420px; max-width: 92vw;
    background: #FFFFFF;
    z-index: 1600;
    box-shadow: -8px 0 32px rgba(11,37,69,0.2);
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex; flex-direction: column;
    border-left: 1px solid var(--border);
  }
  .notification-drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-section);
  }
  .drawer-title { font-size: 16px; font-weight: 800; color: var(--navy); }
  .drawer-actions { display: flex; gap: 8px; align-items: center; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px; }
  .notif-item {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    transition: all 0.15s;
    position: relative;
  }
  .notif-item.unread { background: var(--blue-light); }
  .notif-item.critical { border-left-color: var(--c-critical); }
  .notif-item.high { border-left-color: var(--c-high); }
  .notif-item.gas { border-left-color: var(--c-gas); }
  .notif-item.persistent { border-left-color: var(--c-persistent); }
  .notif-item.low { border-left-color: var(--c-low); }
  .notif-title { font-weight: 800; font-size: 13px; color: var(--navy); margin-bottom: 4px; }
  .notif-msg { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; }
  .notif-meta { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text-muted); margin-top: 8px; }
  .notif-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  /* Toast */
  #toast-container {
    position: fixed; top: 76px; right: 18px;
    z-index: 2000; display: flex; flex-direction: column;
    gap: 10px; max-width: 360px;
  }
  .toast {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-left: 5px solid var(--blue);
    border-radius: 8px;
    padding: 14px 16px;
    box-shadow: var(--shadow-lg);
    font-size: 13px;
    animation: slideIn 0.35s ease;
  }
  .toast.critical { border-left-color: var(--c-critical); }
  .toast.high { border-left-color: var(--c-high); }
  .toast.gas { border-left-color: var(--c-gas); }
  .toast.persistent { border-left-color: var(--c-persistent); }
  .toast.low { border-left-color: var(--c-low); }
  .toast-title { font-weight: 800; margin-bottom: 4px; color: var(--navy); font-size: 13px; }
  .toast-msg { color: var(--text-secondary); font-size: 12px; line-height: 1.4; margin-bottom: 8px; }
  .toast-actions { display: flex; gap: 6px; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Custom marker pulse */
  .pulse-marker { animation: pulseRing 2s infinite; border-radius: 50%; }
  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.7); }
    70% { box-shadow: 0 0 0 16px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  .pulse-marker-orange { animation: pulseRingOrange 2s infinite; border-radius: 50%; }
  @keyframes pulseRingOrange {
    0% { box-shadow: 0 0 0 0 rgba(234,88,12,0.7); }
    70% { box-shadow: 0 0 0 14px rgba(234,88,12,0); }
    100% { box-shadow: 0 0 0 0 rgba(234,88,12,0); }
  }

  /* Legend */
  .legend {
    position: absolute; bottom: 14px; left: 14px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 11px;
    z-index: 500;
    box-shadow: var(--shadow-md);
    max-width: 230px;
  }
  .legend-title {
    font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--navy);
    margin-bottom: 8px; font-size: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; color: var(--text-primary);
    font-size: 11px; font-weight: 500;
  }
  .legend-dot {
    width: 12px; height: 12px; border-radius: 50%;
    flex-shrink: 0; border: 2px solid #FFFFFF;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }
  .legend-square {
    width: 12px; height: 12px; border-radius: 2px;
    flex-shrink: 0; border: 2px solid #FFFFFF;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }

  /* Chart bars */
  .chart-container { padding: 8px 0; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .bar-label { width: 110px; color: var(--text-secondary); flex-shrink: 0; text-align: right; font-weight: 500; }
  .bar-track { flex: 1; height: 20px; background: var(--bg-section); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 11px; font-weight: 800; color: white; }

  /* Leaflet overrides for white theme */
  .leaflet-popup-content-wrapper {
    background: #FFFFFF !important;
    color: var(--navy) !important;
    border-radius: 8px !important;
    border: 1px solid var(--border) !important;
    box-shadow: 0 8px 24px rgba(11,37,69,0.18) !important;
  }
  .leaflet-popup-tip { background: #FFFFFF !important; }
  .leaflet-popup-content { margin: 14px 16px !important; font-size: 13px !important; font-family: 'Source Serif 4', Georgia, serif !important; }
  .leaflet-control-zoom a {
    background: #FFFFFF !important;
    color: var(--navy) !important;
    border-color: var(--border) !important;
    font-weight: bold !important;
  }
  .leaflet-control-zoom a:hover { background: var(--blue-light) !important; color: var(--blue) !important; }
  .leaflet-control-attribution {
    background: rgba(255,255,255,0.85) !important;
    color: var(--text-muted) !important;
    font-size: 9px !important;
  }
  .leaflet-bar { box-shadow: 0 2px 8px rgba(11,37,69,0.15) !important; border: none !important; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-section); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

  /* Responsive */
  @media (max-width: 1024px) {
    .dashboard-grid { grid-template-columns: 1fr 300px; }
  }
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .dashboard-grid { grid-template-columns: 1fr; }
    .right-panel { display: none; }
    .mobile-nav { display: block; }
    .topbar-search { max-width: 200px; }
    .logo-text { font-size: 15px; }
    .content { padding: 12px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .demo-pill { display: none; }
    .notification-drawer { width: 100%; }
    .legend { max-width: 180px; padding: 8px 10px; font-size: 10px; bottom: 8px; left: 8px; }
    .legend-item { font-size: 10px; padding: 3px 0; }
  }
  @media (max-width: 560px) {
    .topbar-search { display: none; }
    .kpi-value { font-size: 22px; }
    .kpi-card { padding: 12px; }
    .logo-text { font-size: 14px; }
    .topbar { padding: 0 12px; gap: 8px; }
    #toast-container { top: 68px; right: 8px; left: 8px; max-width: none; }
  }

  .hidden { display: none !important; }
  .text-muted { color: var(--text-muted); }
  .font-mono { font-family: 'Courier New', monospace; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mb-3 { margin-bottom: 12px; }
  .mt-3 { margin-top: 12px; }
</style>
</head>

        { label:'Thermal intensity factor', pct: Math.round((ra.thermal_factor || 0.35) * 100) },
        { label:'Persistence factor', pct: Math.round((ra.persistence_factor || 0.25) * 100) },
        { label:'Industrial proximity', pct: Math.round((ra.industrial_proximity_factor || 0.25) * 100) },
        { label:'Historical factor', pct: Math.round((ra.historical_factor || 0.1) * 100) },
        { label:'Population proximity', pct: Math.round((ra.population_proximity_factor || 0.05) * 100) }
      ];
    }

    const numConf = Number(e.confidence || 0.9);
    const confPct = Math.round(numConf <= 1 ? numConf * 100 : numConf);

    return {
      id: e.event_id || `TH-${e.id}`,
      dbId: e.id,
      lat: Number(e.latitude),
      lng: Number(e.longitude),
      city: city,
      state: stateName,
      classification: classification,
      eventType: eventType,
      risk: pUpper,
      score: Math.round(Number(e.risk_score || 0)),
      confidence: confPct,
      intensity: e.thermal_intensity || 'HIGH',
      persistence: e.persistence || 'Active',
      facility: e.facility ? e.facility.name : (e.facility_name || null),
      facilityOperator: e.facility ? e.facility.operator : null,
      landcover: e.land_cover || 'Industrial Area',
      source: e.data_source || 'NASA FIRMS',
      detected: detectedStr,
      explanation: explanation,
      factors: factors,
      raw: e
    };
  }

  function mapBackendFacility(f) {
    return {
      id: `FAC-${String(f.id).padStart(3, '0')}`,
      dbId: f.id,
      name: f.name,
      lat: Number(f.latitude),
      lng: Number(f.longitude),
      type: f.industry_type || 'Industrial Processing',
      capacity: f.risk_level || 'Medium',
      operator: f.operator || 'National Consortium',
      address: f.address || '',
      raw: f
    };
  }

  function mapBackendAlert(a) {
    const rawSev = (a.severity || a.risk_priority || 'low').toLowerCase();
    const level = rawSev.includes('crit') ? 'critical' : rawSev.includes('high') ? 'high' : 'low';
    const evId = a.event ? a.event.event_id : (a.event_id ? `DEMO-EVT-${a.event_id}` : 'TH-2026-00421');
    return {
      id: `ALT-${a.alert_id || a.id}`,
      dbId: a.id,
      level: level,
      title: a.title || 'Thermal Alert',
      msg: a.message || 'Thermal risk detected near monitored industrial zone.',
      eventId: evId,
      time: a.created_at ? new Date(a.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Recent',
      unread: !a.is_read,
      ts: a.created_at ? new Date(a.created_at).getTime() : Date.now(),
      raw: a
    };
  }

  /* ========== UTILS ========== */
  function getEventById(id) {
    return currentEvents.find(e => e.id === id || String(e.id) === String(id) || String(e.dbId) === String(id));
  }

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ========== TOASTS ========== */
  function showToast(title, msg, level, eventId) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast ' + (level || '').toLowerCase();
    toast.innerHTML = `
      <div class="toast-title">${escapeHtml(title)}</div>
      <div class="toast-msg">${escapeHtml(msg)}</div>
      <div class="toast-actions">
        ${eventId ? `<button class="btn btn-primary btn-sm" onclick="window.__thermosafe.selectEvent('${eventId}')">View Event</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="this.closest('.toast').remove()">Dismiss</button>
      </div>
    `;
    container.appendChild(toast);
    setTimeout(() => {
      if (!toast.parentNode) return;
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(40px)';
      toast.style.transition = 'all 0.35s';
      setTimeout(() => toast.remove(), 350);
    }, 6500);
  }

  /* ========== NOTIFICATIONS & DRAWER ========== */
  function updateNotifBadge() {
    const unread = state.notifications.filter(n => n.unread).length;
    const badge = document.getElementById('notifCount');
    if (badge) {
      badge.textContent = unread;
      badge.style.display = unread > 0 ? 'flex' : 'none';
    }
  }

  function renderDrawer() {
    const body = document.getElementById('drawerBody');
    if (!body) return;

    const unread = state.notifications.filter(n => n.unread);
    const read = state.notifications.filter(n => !n.unread);

    function notifHtml(n) {
      const btnLabel = n.level === 'critical' ? 'View Event' : 'View on Map';
      return `
        <div class="notif-item ${n.level} ${n.unread ? 'unread' : ''}">
          <div class="notif-title">${escapeHtml(n.title)}</div>
          <div class="notif-msg">${escapeHtml(n.msg)}</div>
          <div class="notif-meta">
            <span>${escapeHtml(n.time)}</span>
            <span>${timeAgo(n.ts)}</span>
          </div>
          <div class="notif-actions">
            <button class="btn btn-primary btn-sm" onclick="window.__thermosafe.selectEvent('${n.eventId}'); window.__thermosafe.closeDrawer();">${btnLabel}</button>
            ${n.unread ? `<button class="btn btn-outline btn-sm" onclick="window.__thermosafe.markRead('${n.id}')">Mark Read</button>` : ''}
          </div>
        </div>
      `;
    }

    let html = '';
    if (unread.length) {
      html += `<div class="nav-section-label" style="padding:6px 4px 8px;">Unread (${unread.length})</div>`;
      html += unread.map(notifHtml).join('');
    }
    if (read.length) {
      html += `<div class="nav-section-label" style="padding:14px 4px 8px;">Read (${read.length})</div>`;
      html += read.map(notifHtml).join('');
    }
    if (!unread.length && !read.length) {
      html = `<div style="text-align:center;padding:40px 10px;color:var(--text-muted);font-size:13px;">No notifications</div>`;
    }

    body.innerHTML = html;
    updateNotifBadge();
  }

  function markRead(id) {
    const n = state.notifications.find(x => x.id === id);
    if (n) {
      n.unread = false;
      if (n.dbId) {
        apiClient.markAlertRead(n.dbId).catch(console.error);
      }
    }
    renderDrawer();
  }

  function markAllRead() {
    state.notifications.forEach(n => {
      n.unread = false;
      if (n.dbId) {
        apiClient.markAlertRead(n.dbId).catch(console.error);
      }
    });
    renderDrawer();
    showToast('Notifications', 'All notifications marked as read.', 'low');
  }

  function clearNotifications() {
    state.notifications = [];
    renderDrawer();
  }

  function addNotification(level, title, msg, eventId) {
    const n = {
      id: 'NT-' + (++state.simCounter),
      level,
      title,
      msg,
      eventId: eventId || 'TH-2026-00421',
      time: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }),
      unread: true,
      ts: Date.now()
    };
    state.notifications.unshift(n);
    renderDrawer();
    updateNotifBadge();
    showToast(title, msg, level, eventId);
  }

  function openDrawer() {
    renderDrawer();
    document.getElementById('notificationDrawer')?.classList.add('open');
    const b = document.getElementById('drawerBackdrop');
    if (b) b.style.display = 'block';
  }

  function closeDrawer() {
    document.getElementById('notificationDrawer')?.classList.remove('open');
    const b = document.getElementById('drawerBackdrop');
    if (b) b.style.display = 'none';
  }

  /* ========== BROWSER PUSH NOTIFICATIONS ========== */
  function requestNotifPermission() {
    if (!('Notification' in window)) {
      showToast('Notifications Unavailable', 'This browser does not support Web Notifications.', 'low');
      return;
    }
    Notification.requestPermission().then(perm => {
      state.browserNotifPermission = perm;
      if (perm === 'granted') {
        showToast('Notifications Enabled', 'You will receive critical thermal alerts.', 'low');
      } else {
        showToast('Notifications Denied', 'Browser notification permission was not granted.', 'low');
      }
    });
  }

  /* ========== LEAFLET MAP & MARKERS ========== */
  function initMap() {
    const mapEl = document.getElementById('map');
    if (!mapEl) return;

    if (state.map) {
      try { state.map.remove(); } catch (e) {}
      state.map = null;
    }

    state.map = L.map('map', {
      center: [22.0, 77.0],
      zoom: 5,
      zoomControl: true,
      attributionControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap contributors | THERMOSAFE AI'
    }).addTo(state.map);

    state.thermalLayer = L.layerGroup().addTo(state.map);
    state.facilityLayer = L.layerGroup().addTo(state.map);

    renderMarkers();
    if (state.showFacilities) renderFacilities();
  }

  function makeThermalIcon(event) {
    const colorObj = getEventColor(event);
    const color = colorObj.hex;
    const isCritical = event.risk === 'CRITICAL';
    const isHigh = event.risk === 'HIGH';
    const size = isCritical ? 24 : isHigh ? 20 : 16;
    const pulseCls = isCritical ? 'pulse-critical' : isHigh ? 'pulse-high' : '';

    return L.divIcon({
      className: '',
      html: `<div class="${pulseCls}" style="
        width:${size}px;height:${size}px;border-radius:50%;
        background:${color};
        border:2.5px solid #FFFFFF;
        box-shadow:0 0 0 1px rgba(11,37,69,0.35), 0 2px 6px rgba(0,0,0,0.25);
        display:flex;align-items:center;justify-content:center;
        "><div style="width:4px;height:4px;border-radius:50%;background:#FFFFFF;"></div></div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2]
    });
  }

  function makeFacilityIcon() {
    return L.divIcon({
      className: '',
      html: `<div style="
        width:16px;height:16px;background:#2563EB;
        border:2.5px solid #FFFFFF;
        box-shadow:0 0 0 1px rgba(11,37,69,0.35), 0 2px 6px rgba(0,0,0,0.25);
        display:flex;align-items:center;justify-content:center;
        border-radius:3px;
        "><svg width="8" height="8" fill="white" viewBox="0 0 24 24"><path d="M3 21h18V8l-8-5-8 5v13zm10-11h-2v2H9v-2H7v4h2v-2h2v2h2v-4z"/></svg></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      popupAnchor: [0, -8]
    });
  }

  function renderMarkers() {
    if (!state.thermalLayer) return;
    state.thermalLayer.clearLayers();
    state.markers = {};
    state.heatmapData = [];

    currentEvents.forEach(ev => {
      const marker = L.marker([ev.lat, ev.lng], {
        icon: makeThermalIcon(ev),
        title: ev.id
      });

      marker.bindPopup(`
        <div style="min-width:220px;font-family:'Source Serif 4',Georgia,serif;">
          <div style="font-weight:800;font-size:14px;color:#0B2545;margin-bottom:4px;">${escapeHtml(ev.id)}</div>
          <div style="font-size:11px;color:#4A5568;margin-bottom:8px;">${escapeHtml(ev.city)}, ${escapeHtml(ev.state)}</div>
          <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
            ${classBadge(ev.classification)}
            ${riskBadge(ev.risk)}
          </div>
          <div style="font-size:12px;margin-bottom:4px;color:#0B2545;"><b>Risk Score:</b> ${ev.score}/100</div>
          <div style="font-size:12px;margin-bottom:4px;color:#0B2545;"><b>AI Confidence:</b> ${ev.confidence}%</div>
          <div style="font-size:12px;margin-bottom:8px;color:#0B2545;"><b>Intensity:</b> ${ev.intensity}</div>
          <button onclick="window.__thermosafe.selectEvent('${ev.id}')" style="
            background:#1E5AA8;color:white;border:none;padding:8px 14px;
            border-radius:6px;font-size:12px;font-weight:700;width:100%;
            cursor:pointer;font-family:inherit;
            ">View Full Analysis</button>
        </div>
      `);

      marker.on('click', () => {
        if (window.innerWidth <= 900) {
          openBottomSheet(ev.id);
        } else {
          selectEvent(ev.id);
        }
      });

      marker.addTo(state.thermalLayer);
      state.markers[ev.id] = marker;
      state.heatmapData.push([ev.lat, ev.lng, Math.min(1, ev.score / 100)]);
    });
  }

  function renderFacilities() {
    if (!state.facilityLayer) return;
    state.facilityLayer.clearLayers();
    currentFacilities.forEach(f => {
      const m = L.marker([f.lat, f.lng], { icon: makeFacilityIcon(), title: f.name });
      m.bindPopup(`
        <div style="min-width:200px;font-family:'Source Serif 4',Georgia,serif;">
          <div style="font-weight:800;font-size:13px;color:#0B2545;margin-bottom:4px;">${escapeHtml(f.name)}</div>
          <div style="font-size:11px;color:#4A5568;margin-bottom:4px;">Facility ID: ${f.id}</div>
          <div style="font-size:12px;color:#0B2545;"><b>Type:</b> ${escapeHtml(f.type)}</div>
          <div style="font-size:12px;color:#0B2545;"><b>Operator:</b> ${escapeHtml(f.operator || 'Industrial')}</div>
          <div style="font-size:12px;color:#0B2545;"><b>Risk Level:</b> ${escapeHtml(f.capacity)}</div>
        </div>
      `);
      m.addTo(state.facilityLayer);
    });
  }

  function toggleHeatmap() {
    state.showHeatmap = !state.showHeatmap;
    if (state.showHeatmap) {
      showToast('Heatmap Enabled', 'Displaying composite thermal risk density.', 'low');
    } else {
      showToast('Heatmap Disabled', 'Default pin marker mode active.', 'low');
    }
  }

  /* ========== EVENT SELECTION & AI PANEL ========== */
  function selectEvent(id) {
    const ev = getEventById(id);
    if (!ev) return;
    state.selectedEvent = ev;

    if (state.map) {
      state.map.setView([ev.lat, ev.lng], 8, { animate: true });
    }

    if (window.innerWidth <= 900) {
      openBottomSheet(id);
    } else {
      renderAIPanel(ev);
    }

    const color = getEventColor(ev);
    showToast(
      `Selected: ${ev.classification}`,
      `${ev.id} · ${ev.city} · Risk ${ev.risk} · Confidence ${ev.confidence}%`,
      color.clsShort,
      ev.id
    );
  }

  function openBottomSheet(id) {
    const ev = getEventById(id);
    if (!ev) return;
    state.selectedEvent = ev;
    const sheet = document.getElementById('bottomSheet');
    const content = document.getElementById('sheetContent');
    if (!sheet || !content) return;

    content.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-weight:800;font-size:15px;color:#0B2545;">${escapeHtml(ev.id)}</div>
        ${riskBadge(ev.risk)}
      </div>
      <div style="font-size:12px;color:#4A5568;margin-bottom:10px;">${escapeHtml(ev.city)}, ${escapeHtml(ev.state)}</div>

        ${classBadge(ev.classification)}

      <div class="detail-row"><span class="detail-label">AI Classification</span><span class="detail-value">${escapeHtml(ev.classification)}</span></div>
      <div class="detail-row"><span class="detail-label">Risk Priority</span><span class="detail-value">${riskBadge(ev.risk)}</span></div>

      <div class="detail-row"><span class="detail-label">AI Confidence</span><span class="detail-value">${ev.confidence}%</span></div>
      <div class="detail-row"><span class="detail-label">Coordinates</span><span class="detail-value font-mono">${ev.lat.toFixed(4)}° N, ${ev.lng.toFixed(4)}° E</span></div>
      <div class="detail-row"><span class="detail-label">Thermal Intensity</span><span class="detail-value">${ev.intensity}</span></div>
      <div class="detail-row"><span class="detail-label">Persistence</span><span class="detail-value">${ev.persistence}</span></div>

      <div class="detail-row"><span class="detail-label">Detection Time</span><span class="detail-value font-mono">${ev.detected}</span></div>
      <div style="margin-top:10px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">AI Explanation</div>
      <div style="margin-top:4px;font-size:12px;color:var(--text-secondary);line-height:1.5;background:var(--bg-section);padding:8px;border-radius:6px;border:1px solid var(--border);">${escapeHtml(ev.explanation)}</div>

      <button class="btn btn-primary btn-block mt-3" onclick="window.__thermosafe.closeBottomSheet(); window.__thermosafe.selectEvent('${ev.id}');">
        View Full Analysis

    `;

  function closeBottomSheet() {
    document.getElementById('bottomSheet')?.classList.remove('open');
  }

  function createAlertFromEvent(id) {
    const ev = getEventById(id);
    if (!ev) return;
    addNotification(

  function renderAnalyticsPage() {

    if (state.backendAnalytics) {
      if (state.backendAnalytics.event_types?.items) {

      }
      if (state.backendAnalytics.risk_distribution?.items) {
        state.backendAnalytics.risk_distribution.items.forEach(i => {
          const k = i.risk_priority.toUpperCase();
          if (riskCounts[k] !== undefined) riskCounts[k] = i.count;
          else if (k.includes('MOD') || k.includes('MED')) riskCounts.MEDIUM = i.count;
        });
      }
      if (state.backendAnalytics.time_series?.data_points) {
        timeSeriesPoints = state.backendAnalytics.time_series.data_points;
      }
    }

    if (!classEntries.length) {
      const classCounts = {};
      currentEvents.forEach(e => { classCounts[e.classification] = (classCounts[e.classification] || 0) + 1; });
      classEntries = Object.entries(classCounts).sort((a, b) => b[1] - a[1]);
      currentEvents.forEach(e => {
        const r = e.risk in riskCounts ? e.risk : 'LOW';
        riskCounts[r] = (riskCounts[r] || 0) + 1;

    content.innerHTML = `

        <div class="card">
          <div class="card-title">Event Classification Breakdown</div>
          <div class="chart-container">
            ${classEntries.map(([name, count]) => {
              const c = EVENT_COLORS[name] || EVENT_COLORS['Unknown'];
              return `
                <div class="bar-row">
                  <div class="bar-label">${name.length > 16 ? name.slice(0,14) + '…' : name}</div>
                  <div class="bar-track">
                    <div class="bar-fill" style="width:${(count/maxClass)*100}%;background:${c.hex};">${count}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-title">Risk Priority Distribution</div>
          <div class="chart-container">
            ${Object.entries(riskCounts).map(([level, count]) => {
              const pct = totalCount > 0 ? (count / totalCount) * 100 : 0;
              return `
                <div class="bar-row">
                  <div class="bar-label">${level}</div>
                  <div class="bar-track">
                    <div class="bar-fill" style="width:${Math.max(pct, 5)}%;background:${getRiskColor(level)};">${count}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">

          ]).map((p) => {
            const h = Math.min(100, Math.max(15, (p.count || p.total_events || 1) * 12));
            const lbl = p.timestamp ? new Date(p.timestamp).toLocaleTimeString([], {hour:'2-digit'}) : (p.label || 'T');

              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  /* ========== SIMULATION ========== */
  function simulate(type) {
    state.simCounter++;
    const id = 'TH-2026-00' + state.simCounter;
    const templates = {
      'Industrial Fire':           { classif:'Industrial Fire', risk:'CRITICAL', score:88 + Math.floor(Math.random()*10), conf:90 + Math.floor(Math.random()*8), facility:'Chemical Plant' },
      'High-Risk Thermal':         { classif:'Industrial Fire', risk:'HIGH', score:74 + Math.floor(Math.random()*12), conf:82 + Math.floor(Math.random()*10), facility:'Steel Plant' },
      'Gas Flare':                 { classif:'Gas Flare', risk:'MEDIUM', score:58 + Math.floor(Math.random()*12), conf:76 + Math.floor(Math.random()*10), facility:'Oil Refinery' },
      'Persistent Thermal Source': { classif:'Persistent Thermal Source', risk:'HIGH', score:75 + Math.floor(Math.random()*15), conf:85 + Math.floor(Math.random()*10), facility:'Thermal Power Plant' }
    };
    const t = templates[type] || templates['Industrial Fire'];
    const cities = [
      { city:'Jamnagar', state:'Gujarat', lat:22.3039, lng:70.8022 },
      { city:'Hazira', state:'Gujarat', lat:21.1167, lng:72.6500 },
      { city:'Visakhapatnam', state:'Andhra Pradesh', lat:17.6868, lng:83.2185 },
      { city:'Mumbai', state:'Maharashtra', lat:19.0760, lng:72.8777 }
    ];
    const loc = cities[Math.floor(Math.random() * cities.length)];
    const jitter = () => (Math.random() - 0.5) * 0.4;

    const newEvent = {
      id,
      lat: loc.lat + jitter(),
      lng: loc.lng + jitter(),
      city: loc.city,
      state: loc.state,
      classification: t.classif,
      risk: t.risk,
      score: t.score,
      confidence: t.conf,
      intensity:'HIGH',
      persistence:'2.4 hours',
      facility: t.facility,
      landcover:'Industrial',
      source:'NASA FIRMS (Simulation)',
      detected: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }),
      explanation: 'Simulated high-radiance thermal anomaly for presentation validation.',
      factors: [
        { label:'Thermal intensity', pct:35 },
        { label:'Industrial proximity', pct:35 },
        { label:'Persistence', pct:20 },
        { label:'Historical pattern', pct:10 }
      ]
    };

    currentEvents.unshift(newEvent);
    renderMarkers();
    addNotification(t.risk === 'CRITICAL' ? 'critical' : 'high',
      `${t.classif} Detected — ${loc.city}`,
      `Thermal activity detected near ${t.facility}. Risk Score: ${t.score}/100.`,
      id
    );
    selectEvent(id);
  }

  function simulateCritical() {
    simulate('Industrial Fire');
  }

  async function downloadReport() {
    const ev = state.selectedEvent || currentEvents[0];
    if (state.isLiveBackend) {
      try {
        showToast('Exporting Report', 'Generating CSV export from backend...', 'low');
        const res = await apiClient.createReport({
          title: `Thermal Incident Export - ${ev.id}`,
          report_type: 'incident_report',
          filters: {
            risk_priority: ev.risk
          }
        });
        if (res && res.id) {
          const csvData = await apiClient.exportReportCsv(res.id);
          const blob = new Blob([csvData], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `thermo_report_${res.id}.csv`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Downloaded', `thermo_report_${res.id}.csv saved.`, 'low');
          return;
        }
      } catch (err) {
        console.warn('Backend export failed, falling back to local file', err);
      }

    const txt = `THERMOSAFE AI — INCIDENT REPORT
================================================
Event ID: ${ev.id}
Location: ${ev.city}, ${ev.state}
Coordinates: ${ev.lat.toFixed(4)}° N, ${ev.lng.toFixed(4)}° E

  async function handleAuthSubmit(event, mode) {
    event.preventDefault();
    const btn = document.getElementById('authSubmitBtn');
    const errBox = document.getElementById('authError');
    if (errBox) errBox.style.display = 'none';
    if (btn) { btn.disabled = true; btn.textContent = 'Processing...'; }

    try {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      let res;
      if (mode === 'signup') {
        const fullName = document.getElementById('authFullName').value.trim();
        let role = document.getElementById('authRole')?.value || 'analyst';
        if (!['admin', 'analyst', 'viewer'].includes(role)) role = 'analyst';
        res = await apiClient.signup(fullName, email, password, role);
      } else {
        res = await apiClient.login(email, password);
      }

      if (res && res.access_token) {
        localStorage.setItem('thermo_jwt_token', res.access_token);
        state.authToken = res.access_token;
        state.currentUser = res.user;
        closeAuthModal();
        updateAuthUI();
        showToast('Authentication Successful', `Welcome, ${state.currentUser.full_name}!`, 'low');
      }
    } catch (err) {
      if (errBox) {
        errBox.textContent = err.message || 'Authentication failed. Please verify credentials.';
        errBox.style.display = 'block';
      }
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In to Platform';
      }
    }
  }

  function logout() {
    localStorage.removeItem('thermo_jwt_token');
    state.authToken = null;
    state.currentUser = null;
    closeAuthModal();
    updateAuthUI();
    showToast('Signed Out', 'You have been signed out successfully.', 'low');
  }

  async function initBackendSync() {
    try {
      const isHealthy = await apiClient.checkHealth();
      if (!isHealthy) {
        setBackendStatus(false);
        updateAuthUI();
        return;
      }
      setBackendStatus(true);

      // Verify stored user session
      if (localStorage.getItem('thermo_jwt_token')) {
        try {
          state.currentUser = await apiClient.getCurrentUser();
          updateAuthUI();
        } catch (e) {
          localStorage.removeItem('thermo_jwt_token');
          state.currentUser = null;
          updateAuthUI();
        }
      } else {
        updateAuthUI();
      }

      // 1. Fetch thermal events
      try {
        const evResp = await apiClient.getThermalEvents(100);
        if (evResp && evResp.items && evResp.items.length > 0) {
          currentEvents = evResp.items.map(mapBackendEvent);
          renderMarkers();
          if (state.currentPage === 'incidents') renderIncidentsPage();
        }
      } catch (err) {
        console.warn('Events fallback to demo:', err);
      }

      // 2. Fetch facilities
      try {
        const facResp = await apiClient.getFacilities(100);
        if (facResp && facResp.items && facResp.items.length > 0) {
          currentFacilities = facResp.items.map(mapBackendFacility);
          renderFacilities();
        }
      } catch (err) {
        console.warn('Facilities fallback to demo:', err);
      }

      // 3. Fetch alerts
      try {
        const alertResp = await apiClient.getAlerts(50);
        if (alertResp && alertResp.items && alertResp.items.length > 0) {
          state.notifications = alertResp.items.map(mapBackendAlert);
          renderDrawer();
          updateNotifBadge();
          if (state.currentPage === 'alerts') renderAlertsPage();
        }
      } catch (err) {
        console.warn('Alerts fallback to demo:', err);
      }

      // 4. Fetch analytics aggregations
      try {
        const summary = await apiClient.getAnalyticsSummary();
        const riskDist = await apiClient.getRiskDistribution();
        const eventTypes = await apiClient.getEventTypes();
        const timeSeries = await apiClient.getTimeSeries();
        state.backendAnalytics = {
          summary,
          risk_distribution: riskDist,
          event_types: eventTypes,
          time_series: timeSeries
        };
        if (state.currentPage === 'dashboard') renderDashboard();
        else if (state.currentPage === 'analytics') renderAnalyticsPage();
      } catch (err) {
        console.warn('Analytics fallback to demo:', err);
      }

      // 5. Fetch reports
      try {
        const reportsResp = await apiClient.getReports(10);
        if (reportsResp && reportsResp.items) {
          state.backendReports = reportsResp.items;
          if (state.currentPage === 'reports') renderReportsPage();
        }
      } catch (err) {
        console.warn('Reports fallback to demo:', err);
      }

    } catch (e) {
      console.warn('Backend unavailable, using demo mode:', e);
      setBackendStatus(false);
    }
  }

  /* ========== ATTACH LISTENERS ========== */
  document.querySelectorAll('.sidebar .nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = btn.getAttribute('data-page');
      if (page) navigateTo(page);
    });
  });

  document.querySelectorAll('.mobile-nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = btn.getAttribute('data-page');
      if (page && page !== 'settings') navigateTo(page);
    });
  });

  document.getElementById('notifBtn')?.addEventListener('click', openDrawer);
  document.getElementById('drawerBackdrop')?.addEventListener('click', closeDrawer);

  document.getElementById('bottomSheet')?.addEventListener('click', (e) => {
    if (e.target.id === 'bottomSheet') closeBottomSheet();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeDrawer();
      closeAuthModal();
    }
  });

  document.getElementById('globalSearch')?.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) return;
    const match = currentEvents.find(ev =>
      ev.id.toLowerCase().includes(q) ||
      (ev.city && ev.city.toLowerCase().includes(q)) ||
      (ev.state && ev.state.toLowerCase().includes(q)) ||
      (ev.facility && ev.facility.toLowerCase().includes(q)) ||
      (ev.classification && ev.classification.toLowerCase().includes(q))
    );
    if (match) {
      selectEvent(match.id);
    }
  });

  /* ========== GLOBAL EXPORT ========== */
  window.__thermosafe = {
    selectEvent,
    openBottomSheet,
    closeBottomSheet,
    simulate,
    simulateCritical,
    acknowledge,
    navigateTo,
    openDrawer,
    closeDrawer,
    markRead,
    markAllRead,
    clearNotifications,
    requestNotifPermission,
    toggleHeatmap,
    createAlertFromEvent,
    trackEvent,
    previewReport,
    downloadReport,
    generateBackendReport,
    shareReport,
    openAuthModal,
    closeAuthModal,
    handleAuthSubmit,
    logout,
    updateAuthUI,
    apiClient,
    state
  };

  /* ========== BOOT ========== */
  function boot() {
    renderDrawer();
    updateNotifBadge();
    navigateTo('dashboard');

    if ('Notification' in window) {
      state.browserNotifPermission = Notification.permission;
    }

    // Connect to live backend asynchronously
    initBackendSync();

    // Check URL hash for direct signup/login page entry
    const hash = window.location.hash || '';
    if (hash === '#signup') {
      openAuthModal('signup');
    } else if (hash === '#login') {
      openAuthModal('login');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
